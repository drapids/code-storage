<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code storage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            font-size: 14px;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
        }

        .header h1 {
            font-weight: 400;
            font-size: 16px;
            color: #f0f6fc;
            letter-spacing: -0.3px;
        }

        .header .ver {
            font-size: 11px;
            color: #8b949e;
            background: #21262d;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            min-width: 220px;
            background: #0d1117;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            padding: 8px 0;
            flex-shrink: 0;
        }

        .sidebar .folder-item,
        .sidebar .file-item {
            display: flex;
            align-items: center;
            padding: 3px 12px 3px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #8b949e;
            transition: 0.1s;
            user-select: none;
            position: relative;
        }

        .sidebar .folder-item:hover,
        .sidebar .file-item:hover {
            background: #1c2128;
            color: #f0f6fc;
        }

        .sidebar .file-item.active {
            background: #1f2937;
            color: #f0f6fc;
        }

        .sidebar .file-item .name {
            color: #c9d1d9;
        }

        .sidebar .folder-item .arrow {
            display: inline-block;
            width: 16px;
            font-size: 11px;
            color: #8b949e;
            transition: 0.1s;
        }

        .sidebar .folder-item .arrow.open {
            transform: rotate(90deg);
        }

        .sidebar .folder-item .fname {
            color: #f0f6fc;
            font-weight: 500;
        }

        .sidebar .children {
            padding-left: 16px;
        }

        .sidebar .children.collapsed {
            display: none;
        }

        .sidebar .file-item .icon {
            color: #8b949e;
            margin-right: 6px;
            font-size: 13px;
        }

        .sidebar .folder-item .icon {
            color: #8b949e;
            margin-right: 6px;
            font-size: 13px;
        }

        .sidebar .edit-controls {
            display: none;
            margin-left: auto;
            gap: 2px;
        }

        .sidebar .edit-controls.show {
            display: flex;
        }

        .sidebar .edit-controls button {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 11px;
            padding: 0 4px;
            font-family: inherit;
        }

        .sidebar .edit-controls button:hover {
            color: #f0f6fc;
        }

        .sidebar .edit-controls button.del:hover {
            color: #f85149;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0d1117;
            overflow: hidden;
        }

        .content .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
            min-height: 36px;
        }

        .content .toolbar .file-info {
            font-size: 13px;
            color: #8b949e;
        }

        .content .toolbar .file-info .path {
            color: #f0f6fc;
        }

        .content .toolbar .actions {
            display: flex;
            gap: 6px;
        }

        .content .toolbar .actions button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 2px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .content .toolbar .actions button:hover {
            background: #30363d;
        }

        .content .code-area {
            flex: 1;
            padding: 16px;
            overflow: auto;
            background: #0d1117;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: #c9d1d9;
        }

        .content .code-area textarea {
            width: 100%;
            height: 100%;
            background: #0d1117;
            border: none;
            color: #c9d1d9;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            outline: none;
            padding: 0;
        }

        .content .code-area textarea:focus {
            outline: none;
        }

        .content .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #8b949e;
            font-size: 14px;
        }

        .content .empty-state .big {
            font-size: 28px;
            margin-bottom: 8px;
            color: #30363d;
        }

        .editor-toggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
            z-index: 50;
            transition: 0.1s;
        }

        .editor-toggle:hover {
            background: #30363d;
            color: #f0f6fc;
        }

        .editor-toggle.active {
            background: #1f3a2a;
            border-color: #3a6a4a;
            color: #7aee7a;
        }

        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .password-modal.show {
            display: flex;
        }

        .password-modal .box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px 32px;
            width: 320px;
        }

        .password-modal .box h3 {
            font-weight: 400;
            font-size: 16px;
            color: #f0f6fc;
            margin-bottom: 12px;
        }

        .password-modal .box input {
            width: 100%;
            padding: 6px 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .password-modal .box input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .password-modal .box .btn-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .password-modal .box .btn-row button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .password-modal .box .btn-row button:hover {
            background: #30363d;
        }

        .password-modal .box .btn-row button.primary {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }

        .password-modal .box .btn-row button.primary:hover {
            background: #388bfd;
        }

        .password-modal .box .error {
            color: #f85149;
            font-size: 12px;
            margin-bottom: 8px;
            display: none;
        }

        .password-modal .box .error.show {
            display: block;
        }

        .folder-actions {
            display: none;
            padding: 4px 12px;
            gap: 4px;
            flex-wrap: wrap;
        }

        .folder-actions.show {
            display: flex;
        }

        .folder-actions button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 2px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
        }

        .folder-actions button:hover {
            background: #30363d;
        }

        .sidebar .file-item .edit-controls button {
            font-size: 10px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 80;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-overlay .box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px 24px;
            width: 400px;
            max-width: 90vw;
        }

        .modal-overlay .box h3 {
            font-weight: 400;
            font-size: 15px;
            color: #f0f6fc;
            margin-bottom: 10px;
        }

        .modal-overlay .box input {
            width: 100%;
            padding: 5px 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-size: 13px;
            font-family: inherit;
            margin-bottom: 8px;
        }

        .modal-overlay .box input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .modal-overlay .box textarea {
            width: 100%;
            min-height: 120px;
            padding: 5px 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-size: 13px;
            font-family: 'Consolas', monospace;
            resize: vertical;
            margin-bottom: 8px;
        }

        .modal-overlay .box textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .modal-overlay .box .btn-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-overlay .box .btn-row button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .modal-overlay .box .btn-row button:hover {
            background: #30363d;
        }

        .modal-overlay .box .btn-row button.primary {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }

        .modal-overlay .box .btn-row button.primary:hover {
            background: #388bfd;
        }

        .modal-overlay .box .btn-row button.danger {
            background: #3a1a1a;
            border-color: #5a2a2a;
            color: #f85149;
        }

        .modal-overlay .box .btn-row button.danger:hover {
            background: #5a2a2a;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 160px;
                min-width: 160px;
            }
            .sidebar .folder-item,
            .sidebar .file-item {
                font-size: 12px;
                padding: 2px 8px 2px 12px;
            }
            .header h1 {
                font-size: 14px;
            }
            .content .code-area {
                font-size: 12px;
                padding: 10px;
            }
            .modal-overlay .box {
                width: 95vw;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <div class="header">
            <h1>code storage</h1>
            <span class="ver">v1.0</span>
        </div>
        <div class="main">
            <div class="sidebar" id="sidebar">
                <!-- sidebar rendered by js -->
            </div>
            <div class="content">
                <div class="toolbar">
                    <div class="file-info" id="fileInfo">No file selected</div>
                    <div class="actions" id="toolbarActions">
                        <button id="copyBtn" style="display:none;">copy</button>
                        <button id="downloadBtn" style="display:none;">download</button>
                    </div>
                </div>
                <div class="code-area" id="codeArea">
                    <div class="empty-state" id="emptyState">
                        <div class="big">~</div>
                        <div>Select a file from the sidebar</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="editor-toggle" id="editorToggle">editor</button>

    <div class="password-modal" id="passwordModal">
        <div class="box">
            <h3>editor access</h3>
            <div class="error" id="passError">incorrect password</div>
            <input type="password" id="passInput" placeholder="password">
            <div class="btn-row">
                <button id="passCancel">cancel</button>
                <button class="primary" id="passSubmit">unlock</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="box" id="modalBox">
            <h3 id="modalTitle">New File</h3>
            <div id="modalBody"></div>
            <div class="btn-row" id="modalButtons"></div>
        </div>
    </div>

    <script>
        // --- DATA ---
        let data = {
            folders: {}
        };

        let currentFile = null; // full path like "/folder/file"
        let editorMode = false;
        let selectedFolder = '/';

        // --- HELPERS ---
        function getFolder(path) {
            const parts = path.split('/').filter(Boolean);
            let current = data.folders;
            for (const p of parts) {
                if (!current[p]) {
                    current[p] = { files: {}, folders: {} };
                }
                current = current[p];
            }
            return current;
        }

        function getItem(path) {
            const parts = path.split('/').filter(Boolean);
            if (parts.length === 0) return data.folders;
            const file = parts.pop();
            const folder = getFolder('/' + parts.join('/'));
            if (folder.files && folder.files[file]) {
                return { type: 'file', content: folder.files[file], parent: folder, name: file };
            }
            if (folder.folders && folder.folders[file]) {
                return { type: 'folder', content: folder.folders[file], parent: folder, name: file };
            }
            return null;
        }

        function getParentFolder(path) {
            const parts = path.split('/').filter(Boolean);
            if (parts.length <= 1) return { folder: data.folders, name: '/' };
            const name = parts.pop();
            const folder = getFolder('/' + parts.join('/'));
            return { folder, name };
        }

        function getAllFiles() {
            const result = [];
            function walk(folder, prefix) {
                for (const [name, f] of Object.entries(folder.folders || {})) {
                    const path = prefix + '/' + name;
                    walk(f, path);
                }
                for (const [name] of Object.entries(folder.files || {})) {
                    result.push(prefix + '/' + name);
                }
            }
            walk(data.folders, '');
            return result;
        }

        function sortObjectKeys(obj) {
            const keys = Object.keys(obj).sort((a, b) => a.localeCompare(b));
            const sorted = {};
            for (const k of keys) sorted[k] = obj[k];
            return sorted;
        }

        function normalizeData() {
            function sortFolders(folder) {
                if (folder.folders) {
                    folder.folders = sortObjectKeys(folder.folders);
                    for (const f of Object.values(folder.folders)) {
                        sortFolders(f);
                    }
                }
                if (folder.files) {
                    folder.files = sortObjectKeys(folder.files);
                }
            }
            sortFolders(data.folders);
        }

        function saveData() {
            normalizeData();
            try {
                localStorage.setItem('codeStorageData', JSON.stringify(data));
            } catch (e) {}
        }

        function loadData() {
            try {
                const saved = localStorage.getItem('codeStorageData');
                if (saved) {
                    data = JSON.parse(saved);
                    normalizeData();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // --- RENDER ---
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            const folderActions = document.createElement('div');
            folderActions.className = 'folder-actions' + (editorMode ? ' show' : '');
            folderActions.id = 'folderActions';
            folderActions.innerHTML = `
                <button id="newFolderBtn">new folder</button>
                <button id="newFileBtn">new file</button>
            `;
            sidebar.appendChild(folderActions);

            function renderFolder(folder, path, depth) {
                const container = document.createElement('div');

                // Sort keys
                const keys = Object.keys(folder.folders || {}).sort((a, b) => a.localeCompare(b));

                for (const name of keys) {
                    const childPath = path + '/' + name;
                    const div = document.createElement('div');
                    div.className = 'folder-item';
                    div.style.paddingLeft = (12 + depth * 16) + 'px';

                    const arrow = document.createElement('span');
                    arrow.className = 'arrow open';
                    arrow.textContent = '▸';
                    div.appendChild(arrow);

                    const icon = document.createElement('span');
                    icon.className = 'icon';
                    icon.textContent = '📁';
                    div.appendChild(icon);

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'fname';
                    nameSpan.textContent = name;
                    div.appendChild(nameSpan);

                    const controls = document.createElement('span');
                    controls.className = 'edit-controls' + (editorMode ? ' show' : '');
                    controls.innerHTML = `
                        <button class="del" data-path="${childPath}">×</button>
                    `;
                    div.appendChild(controls);

                    const children = document.createElement('div');
                    children.className = 'children';
                    children.dataset.path = childPath;

                    let isOpen = true;

                    div.addEventListener('click', function(e) {
                        if (e.target.closest('.edit-controls')) return;
                        isOpen = !isOpen;
                        children.classList.toggle('collapsed', !isOpen);
                        arrow.classList.toggle('open', isOpen);
                    });

                    // Delete folder
                    controls.querySelector('.del').addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (confirm('Delete folder "' + name + '" and all contents?')) {
                            deleteFolder(childPath);
                        }
                    });

                    container.appendChild(div);
                    container.appendChild(children);

                    const subFolder = folder.folders[name];
                    const subContainer = renderFolder(subFolder, childPath, depth + 1);
                    children.appendChild(subContainer);

                    // Render files in this folder
                    const files = Object.keys(folder.files || {}).sort((a, b) => a.localeCompare(b));
                    for (const fname of files) {
                        const filePath = childPath + '/' + fname;
                        const fdiv = document.createElement('div');
                        fdiv.className = 'file-item' + (currentFile === filePath ? ' active' : '');
                        fdiv.style.paddingLeft = (12 + (depth + 1) * 16) + 'px';

                        const icon = document.createElement('span');
                        icon.className = 'icon';
                        icon.textContent = '📄';
                        fdiv.appendChild(icon);

                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'name';
                        nameSpan.textContent = fname;
                        fdiv.appendChild(nameSpan);

                        const controls = document.createElement('span');
                        controls.className = 'edit-controls' + (editorMode ? ' show' : '');
                        controls.innerHTML = `
                            <button class="del" data-path="${filePath}">×</button>
                        `;
                        fdiv.appendChild(controls);

                        fdiv.addEventListener('click', function(e) {
                            if (e.target.closest('.edit-controls')) return;
                            openFile(filePath);
                        });

                        controls.querySelector('.del').addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (confirm('Delete file "' + fname + '"?')) {
                                deleteFile(filePath);
                            }
                        });

                        children.appendChild(fdiv);
                    }
                }

                return container;
            }

            const root = renderFolder(data.folders, '', 0);
            sidebar.appendChild(root);

            // Event listeners for new buttons
            document.getElementById('newFolderBtn').addEventListener('click', function() {
                showModal('New Folder', 'Enter folder name:', 'text', '', function(val) {
                    if (val && val.trim()) {
                        createFolder(val.trim());
                    }
                });
            });

            document.getElementById('newFileBtn').addEventListener('click', function() {
                showModal('New File', 'Enter file name (with extension):', 'text', '', function(val) {
                    if (val && val.trim()) {
                        createFile(val.trim(), '');
                    }
                });
            });

            updateToolbar();
        }

        function renderContent() {
            const codeArea = document.getElementById('codeArea');
            const emptyState = document.getElementById('emptyState');
            const fileInfo = document.getElementById('fileInfo');
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!currentFile) {
                emptyState.style.display = 'flex';
                codeArea.innerHTML = '<div class="empty-state" style="display:flex;"><div class="big">~</div><div>Select a file from the sidebar</div></div>';
                fileInfo.textContent = 'No file selected';
                copyBtn.style.display = 'none';
                downloadBtn.style.display = 'none';
                return;
            }

            const item = getItem(currentFile);
            if (!item || item.type !== 'file') {
                emptyState.style.display = 'flex';
                codeArea.innerHTML = '<div class="empty-state" style="display:flex;"><div class="big">~</div><div>File not found</div></div>';
                fileInfo.textContent = 'File not found';
                copyBtn.style.display = 'none';
                downloadBtn.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            const content = item.content || '';
            fileInfo.textContent = currentFile;
            copyBtn.style.display = 'inline-block';
            downloadBtn.style.display = 'inline-block';

            if (editorMode) {
                codeArea.innerHTML = `<textarea id="editArea">${escapeHtml(content)}</textarea>`;
                const textarea = document.getElementById('editArea');
                textarea.addEventListener('input', function() {
                    const item2 = getItem(currentFile);
                    if (item2 && item2.type === 'file') {
                        item2.content = this.value;
                        saveData();
                    }
                });
            } else {
                codeArea.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-all;font-family:inherit;">${escapeHtml(content)}</pre>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateToolbar() {
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            copyBtn.onclick = function() {
                if (!currentFile) return;
                const item = getItem(currentFile);
                if (item && item.type === 'file') {
                    navigator.clipboard.writeText(item.content || '').then(() => {
                        const orig = this.textContent;
                        this.textContent = 'copied!';
                        setTimeout(() => { this.textContent = orig; }, 1500);
                    }).catch(() => {});
                }
            };

            downloadBtn.onclick = function() {
                if (!currentFile) return;
                const item = getItem(currentFile);
                if (item && item.type === 'file') {
                    const name = currentFile.split('/').pop();
                    const blob = new Blob([item.content || ''], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = name;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            };
        }

        // --- OPERATIONS ---
        function openFile(path) {
            currentFile = path;
            renderSidebar();
            renderContent();
        }

        function createFolder(name) {
            if (!name || name.includes('/') || name.includes('\\')) return;
            const folder = getFolder(selectedFolder);
            if (folder.folders[name]) { alert('Folder already exists'); return; }
            folder.folders[name] = { files: {}, folders: {} };
            saveData();
            renderSidebar();
        }

        function createFile(name, content) {
            if (!name || name.includes('/') || name.includes('\\')) return;
            const folder = getFolder(selectedFolder);
            if (folder.files[name]) { alert('File already exists'); return; }
            folder.files[name] = content || '';
            saveData();
            renderSidebar();
            openFile(selectedFolder + '/' + name);
        }

        function deleteFile(path) {
            const parent = getParentFolder(path);
            if (parent.folder && parent.folder.files) {
                delete parent.folder.files[parent.name];
                if (currentFile === path) {
                    currentFile = null;
                }
                saveData();
                renderSidebar();
                renderContent();
            }
        }

        function deleteFolder(path) {
            const parent = getParentFolder(path);
            if (parent.folder && parent.folder.folders) {
                delete parent.folder.folders[parent.name];
                if (currentFile && currentFile.startsWith(path)) {
                    currentFile = null;
                }
                saveData();
                renderSidebar();
                renderContent();
            }
        }

        // --- MODAL ---
        function showModal(title, label, inputType, initialValue, callback) {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            const titleEl = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const buttons = document.getElementById('modalButtons');

            titleEl.textContent = title;
            body.innerHTML = '';
            buttons.innerHTML = '';

            const labelEl = document.createElement('label');
            labelEl.textContent = label;
            labelEl.style.display = 'block';
            labelEl.style.marginBottom = '4px';
            labelEl.style.fontSize = '13px';
            labelEl.style.color = '#8b949e';
            body.appendChild(labelEl);

            if (inputType === 'textarea') {
                const ta = document.createElement('textarea');
                ta.id = 'modalInput';
                ta.placeholder = 'Paste your code here...';
                ta.value = initialValue || '';
                body.appendChild(ta);
                setTimeout(() => ta.focus(), 100);
            } else {
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'modalInput';
                input.placeholder = 'Enter name...';
                input.value = initialValue || '';
                body.appendChild(input);
                setTimeout(() => input.focus(), 100);
            }

            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'cancel';
            cancelBtn.onclick = function() {
                overlay.classList.remove('show');
            };
            buttons.appendChild(cancelBtn);

            const okBtn = document.createElement('button');
            okBtn.className = 'primary';
            okBtn.textContent = 'ok';
            okBtn.onclick = function() {
                const val = document.getElementById('modalInput').value;
                overlay.classList.remove('show');
                if (callback) callback(val);
            };
            buttons.appendChild(okBtn);

            overlay.classList.add('show');

            // Enter key submit
            const input = document.getElementById('modalInput');
            if (input) {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        okBtn.click();
                    }
                });
            }
        }

        // --- EDITOR MODE ---
        let isEditorActive = false;

        document.getElementById('editorToggle').addEventListener('click', function() {
            if (!isEditorActive) {
                document.getElementById('passwordModal').classList.add('show');
                document.getElementById('passInput').value = '';
                document.getElementById('passError').classList.remove('show');
                setTimeout(() => document.getElementById('passInput').focus(), 100);
            } else {
                isEditorActive = false;
                editorMode = false;
                this.textContent = 'editor';
                this.classList.remove('active');
                document.getElementById('folderActions').classList.remove('show');
                renderSidebar();
                renderContent();
            }
        });

        document.getElementById('passCancel').addEventListener('click', function() {
            document.getElementById('passwordModal').classList.remove('show');
        });

        document.getElementById('passSubmit').addEventListener('click', function() {
            const pass = document.getElementById('passInput').value;
            if (pass === '1234') {
                document.getElementById('passwordModal').classList.remove('show');
                isEditorActive = true;
                editorMode = true;
                document.getElementById('editorToggle').textContent = 'editor on';
                document.getElementById('editorToggle').classList.add('active');
                document.getElementById('folderActions').classList.add('show');
                renderSidebar();
                renderContent();
            } else {
                document.getElementById('passError').classList.add('show');
                document.getElementById('passInput').value = '';
                document.getElementById('passInput').focus();
            }
        });

        document.getElementById('passInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('passSubmit').click();
            }
            if (e.key === 'Escape') {
                document.getElementById('passCancel').click();
            }
        });

        // Close modal on overlay click
        document.getElementById('passwordModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('show');
            }
        });

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('show');
            }
        });

        // --- EXPORT / IMPORT ---
        function exportHTML() {
            const dataStr = JSON.stringify(data);
            const script = `
            <script>
                window.__embeddedData = ${dataStr};
            <\/script>
            `;

            const html = document.documentElement.outerHTML
                .replace('</head>', script + '</head>')
                .replace(
                    /<script>[\s\S]*?<\/script>/,
                    '<script>// data embedded in window.__embeddedData\n' +
                    'if (window.__embeddedData) { data = window.__embeddedData; saveData(); renderSidebar(); renderContent(); }' +
                    '<\/script>'
                );

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'code_storage.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- INIT ---
        function init() {
            if (!loadData()) {
                // Default structure
                data = {
                    folders: {
                        'examples': {
                            files: {
                                'example.txt': 'This is an example file.\nYou can edit this in editor mode.'
                            },
                            folders: {}
                        }
                    }
                };
                saveData();
            }

            // Check for embedded data
            if (window.__embeddedData) {
                data = window.__embeddedData;
                saveData();
                window.__embeddedData = null;
            }

            renderSidebar();
            renderContent();

            // Add export button to header
            const header = document.querySelector('.header');
            const exportBtn = document.createElement('button');
            exportBtn.textContent = 'export';
            exportBtn.style.cssText = `
                background: #21262d;
                border: 1px solid #30363d;
                color: #c9d1d9;
                padding: 2px 12px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 11px;
                font-family: inherit;
            `;
            exportBtn.onmouseover = function() { this.style.background = '#30363d'; };
            exportBtn.onmouseout = function() { this.style.background = '#21262d'; };
            exportBtn.onclick = exportHTML;
            header.appendChild(exportBtn);

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('passwordModal').classList.contains('show')) {
                        document.getElementById('passwordModal').classList.remove('show');
                    }
                    if (document.getElementById('modalOverlay').classList.contains('show')) {
                        document.getElementById('modalOverlay').classList.remove('show');
                    }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
                    e.preventDefault();
                    document.getElementById('editorToggle').click();
                }
            });
        }

        // Handle iframe / netlify etc
        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            init();
        }
    </script>
</body>
</html>
